[package]
name = "light_epub"
version = "0.1.1"
edition = "2024"
description = "A fast, memory-efficient EPUB parsing library utilizing zero-copy access, designed with no_std compatibility in mind."
license = "MIT OR Apache-2.0"
repository = "https://github.com/foxpc-ai/light-epub"
keywords = ["epub", "no_std", "parser", "ebook"]
categories = ["parser-implementations", "parsing"]

[dependencies]
nom = { version = "8.0", default-features = false }

miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }

serde = { version = "1.0.228", default-features = false, optional = true, features = ["derive", "alloc"] }

quick-xml = { version = "0.38.4", default-features = false}

[features]

default = ["std"]

std = ["alloc", "nom/std", "serde?/std"]

alloc = ["serde?/alloc"]